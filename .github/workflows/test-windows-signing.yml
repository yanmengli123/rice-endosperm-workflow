name: Windows Test Signing

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-signing:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Cache Trunk and Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-tools-${{ runner.os }}-v1

      - name: Install Trunk and Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command trunk -ErrorAction SilentlyContinue)) {
            cargo install trunk --locked
          }
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
          }

      - name: Build unsigned Windows installers
        shell: pwsh
        run: cargo tauri build --bundles msi,nsis

      - name: Locate unsigned installers
        id: installers
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem "target/release/bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "target/release/bundle/nsis/*.exe")
          if ($msi.Count -ne 1) {
            throw "Expected one MSI installer, found $($msi.Count)"
          }
          if ($nsis.Count -ne 1) {
            throw "Expected one NSIS installer, found $($nsis.Count)"
          }
          "msi=$($msi[0].FullName)" >> $env:GITHUB_OUTPUT
          "nsis=$($nsis[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned MSI
        id: unsigned-msi
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installers.outputs.msi }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned NSIS installer
        id: unsigned-nsis
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installers.outputs.nsis }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Test-sign MSI with SignPath
        id: sign-msi
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5664b725-0848-42aa-a098-65be8f18d107
          project-slug: wisp-science
          signing-policy-slug: test-signing
          artifact-configuration-slug: msi-installer
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}/signed/msi
          skip-decompress: true

      - name: Test-sign NSIS installer with SignPath
        id: sign-nsis
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 5664b725-0848-42aa-a098-65be8f18d107
          project-slug: wisp-science
          signing-policy-slug: test-signing
          artifact-configuration-slug: nsis-installer
          github-artifact-id: ${{ steps.unsigned-nsis.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}/signed/nsis
          skip-decompress: true

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ runner.temp }}/signed/msi/*.msi"
          $files += Get-ChildItem "${{ runner.temp }}/signed/nsis/*.exe"
          if ($files.Count -ne 2) {
            throw "Expected two signed installers, found $($files.Count)"
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($null -eq $signature.SignerCertificate) {
              throw "$($file.Name) does not contain an Authenticode signature"
            }
            Write-Host "$($file.Name): $($signature.Status) - $($signature.SignerCertificate.Subject)"
          }

      - name: Upload test-signed installers
        uses: actions/upload-artifact@v7
        with:
          name: test-signed-installers-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signed/msi/*.msi
            ${{ runner.temp }}/signed/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Add signing requests to summary
        shell: pwsh
        run: |
          "MSI signing request: ${{ steps.sign-msi.outputs.signing-request-web-url }}" >> $env:GITHUB_STEP_SUMMARY
          "NSIS signing request: ${{ steps.sign-nsis.outputs.signing-request-web-url }}" >> $env:GITHUB_STEP_SUMMARY
