name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.1.0)
        required: true
        default: v0.1.0
      signing_policy:
        description: SignPath signing policy slug (tag pushes always use release-signing)
        required: true
        default: test-signing
      publish:
        description: Publish GitHub release (uncheck for a signing dry-run)
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SIGNING_POLICY: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_policy || 'release-signing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Load the waiter from this workflow revision, not the tagged app tree.
      # workflow_dispatch can rebuild an older tag that does not contain the action.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/wait-for-release
          path: _release_ci

      - name: Wait for GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        id: release
        uses: ./_release_ci/.github/actions/wait-for-release
        with:
          tag: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui -> target
          cache-on-failure: true

      - name: Cache Trunk and Tauri CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: tauri-tools-${{ runner.os }}-v1

      - name: Install Trunk and Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command trunk -ErrorAction SilentlyContinue)) {
            cargo install trunk --locked
          }
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
          }

      # Safety net: never publish installers signed with the test certificate.
      - name: Guard against publishing test-signed installers
        if: github.event_name == 'workflow_dispatch' && inputs.publish && env.SIGNING_POLICY != 'release-signing'
        shell: pwsh
        run: Write-Error "publish=true requires signing_policy=release-signing"

      # Build only; signing (SignPath) must happen before the release is published.
      - name: Build Tauri bundles
        shell: pwsh
        run: cargo tauri build --bundles msi,nsis

      # SignPath: the API token belongs to a CI user that is a submitter for the
      # release-signing policy. OrganizationId is not a secret.
      # Set repo variable SKIP_WINDOWS_SIGNING=true to publish unsigned
      # installers (e.g. while the release certificate is still being issued).
      - name: Sign installers with SignPath
        if: vars.SKIP_WINDOWS_SIGNING != 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name SignPath -Scope CurrentUser -Force
          $artifacts = @(
            # MSI and NSIS use different root file types, so select each configuration explicitly.
            @{ Files = Get-ChildItem "target/release/bundle/msi/*.msi"; ConfigSlug = "msi-installer" }
            @{ Files = Get-ChildItem "target/release/bundle/nsis/*.exe"; ConfigSlug = "nsis-installer" }
          )
          $found = $artifacts | ForEach-Object { $_.Files }
          if (-not $found) {
            Write-Error "No installer artifacts found to sign"
          }
          foreach ($group in $artifacts) {
            foreach ($artifact in $group.Files) {
              Write-Host "Signing $($artifact.Name)"
              $signed = Join-Path $env:RUNNER_TEMP $artifact.Name
              $params = @{
                InputArtifactPath   = $artifact.FullName
                ApiToken            = $env:SIGNPATH_API_TOKEN
                OrganizationId      = "5664b725-0848-42aa-a098-65be8f18d107"
                ProjectSlug         = "wisp-science"
                SigningPolicySlug   = $env:SIGNING_POLICY
                OutputArtifactPath  = $signed
                Description         = "wisp-science $env:RELEASE_TAG"
                WaitForCompletion   = $true
              }
              if ($group.ConfigSlug) {
                $params.ArtifactConfigurationSlug = $group.ConfigSlug
              }
              Submit-SigningRequest @params
              Move-Item -Force $signed $artifact.FullName
            }
          }

      # Dry-run (publish=false): keep the signed installers as workflow artifacts
      # so the signatures can be inspected without cutting a release.
      - name: Upload signed installers as workflow artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: signed-installers-${{ env.RELEASE_TAG }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Upload installers to the existing GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @()
          $files += Get-ChildItem "target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $files += Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No installer artifacts found to upload"
            exit 1
          }
          gh release upload $env:RELEASE_TAG --clobber @($files.FullName)
